<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seerah Academy | Interactive Learning Roadmap</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg-card: #ffffff;
            --bg-main: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 1.25rem;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            color: var(--text-main);
        }
        ul {
            list-style-type: none;
        }
        li {
            background: #f1f5f9;
            margin-bottom: 10px;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        li:hover {
            background: #e2e8f0;
        }
        a {
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Serah Academy</h1>
        
        <div class="section-title">پەرتووک و سەرچاوەکان (Books & References)</div>
        <ul>
            <li>
                <span>قصص الأنبياء (Stories of the Prophets)</span>
                <!-- کاتێک فایلەکەت لە گیتهەب دانا، لینکەکەی لێرە دابنە -->
                <a href="https://raw.githubusercontent.com/bahraadel2005-maker/Serah123/main/Book/nadawi_qisas_anbiya_1996.pdf" target="_blank">بینینی فایل (View PDF)</a>
            </li>
        </ul>
    </div>

</body>
</html>
